name: Chomsky-Godel zero-ambiguity gate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v test_chomsky_gate
      - run: sh -n cosmic-love-chomsky-godel.sh
